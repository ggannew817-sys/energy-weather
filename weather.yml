name: Weather Harvester (Energy Forecast)

# 법인 위치별 월별 기상 특성치(HDD/CDD/절대습도/잠열도일)를 Open-Meteo에서 수집.
# 산출물은 비민감(공개 기상) → 아티팩트 + 레포 커밋(raw 공개)로 로컬이 매일 받아감.
# 에너지·생산 실적 등 민감 데이터는 이 리포에 두지 않는다. (API 키 불필요)

on:
  workflow_dispatch: {}            # 수동 실행 버튼
  schedule:
    - cron: '0 20 * * *'           # 매일 20:00 UTC(=익일 05:00 KST) — 무인 일일 수집

permissions:
  contents: write                  # commit-back(raw 최신 유지)에 필요

jobs:
  harvest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: pip install -r requirements.txt
      - run: python fetch_weather.py
      - uses: actions/upload-artifact@v4
        with:
          name: weather-csv
          path: data/weather_*.csv
      - name: Commit weather data (raw 공개 유지 — 로컬 pull.ps1이 받아감)
        run: |
          git config user.name  "weather-bot"
          git config user.email "weather-bot@users.noreply.github.com"
          git add data/weather_*.csv
          git commit -m "chore: update weather $(date -u +%F)" || echo "no change"
          git push || echo "push skipped"
